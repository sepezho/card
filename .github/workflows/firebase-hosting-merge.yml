name: Legacy Firebase Hosting (live, manual only)
# Legacy path: Firebase config and npm lockfile were removed in 2023.
# Production uses Docker Hub + Hetzner; Firebase must not run automatically.
# Restore the Firebase config/lockfile before explicitly enabling this job.
'on': workflow_dispatch
jobs:
  build_and_deploy:
    if: ${{ vars.ENABLE_LEGACY_FIREBASE == 'true' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v3
      - run: npm ci && npm run build
      - uses: FirebaseExtended/action-hosting-deploy@v0
        with:
          repoToken: '${{ secrets.GITHUB_TOKEN }}'
          firebaseServiceAccount: '${{ secrets.FIREBASE_SERVICE_ACCOUNT_SEPEZHOTEST }}'
          channelId: live
          projectId: sepezhotest
